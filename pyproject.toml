[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumo-bench"
version = "0.1.0"
description = "Benchmark of NVIDIA Kumo Tabular against tuned gradient-boosted trees"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
